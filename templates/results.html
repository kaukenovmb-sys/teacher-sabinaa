<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Нәтижелер · Teacher Sabina</title><link rel="stylesheet" href="/static/style.css"></head><body class="school-bg"><div class="decor-layer"><span class="d-star">⭐</span><span class="d-pencil">✏️</span><span class="d-book">📚</span></div><nav class="topbar"><div class="brand"><span>👩‍🏫</span><div><b>Teacher Sabina</b><small>Нәтижелер</small></div></div><a href="/admin" class="btn">← Тапсырмалар</a></nav><main class="page-wrap"><section class="glass results-shell"><div class="result-head"><div><span class="eyebrow">RESULTS</span><h1>{{task.title}}</h1><p class="muted">Оқушылардың аты, ұпайы және орындау уақыты.</p></div><div class="result-trophy">🏆</div></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Оқушы</th><th>Ұпай</th><th>Уақыт</th><th>Күні</th></tr></thead><tbody>{% for r in results %}<tr><td>{{loop.index}}</td><td><b>{{r.student_name}}</b></td><td><strong>{{r.score}} / {{r.total}}</strong></td><td>⏱ {{r.time_seconds}}с</td><td>{{r.created_at}}</td></tr>{% else %}<tr><td colspan="5">Әзірге нәтиже жоқ.</td></tr>{% endfor %}</tbody></table></div></section></main></body></html>
